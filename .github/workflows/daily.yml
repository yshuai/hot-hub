name: daily digest
on:
  schedule:
    - cron: "0 0 * * *" # UTC 00:00 = 北京时间 08:00
  workflow_dispatch:
permissions:
  contents: write
jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/daily.mjs
      - name: commit archive
        run: |
          git config user.name "hot-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily/
          git diff --cached --quiet || git commit -m "chore(daily): $(date -u +%F) 日报归档"
          git push
